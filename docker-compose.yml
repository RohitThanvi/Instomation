x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instomation}:${POSTGRES_PASSWORD:-instomation}@postgres:5432/${POSTGRES_DB:-instomation}
    REDIS_URL: redis://redis:6379/0

x-worker: &worker
  <<: *backend
  command: ["arq", "app.workers.settings.WorkerSettings"]
  healthcheck:
    # Fails when the worker is dead or stuck (it refreshes a liveness key every WORKER_HEALTH_CHECK_SECONDS).
    test: ["CMD", "arq", "app.workers.settings.WorkerSettings", "--check"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-instomation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instomation}
      POSTGRES_DB: ${POSTGRES_DB:-instomation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-instomation}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One process per queue (see app/workers/queues.py): a worker consumes exactly the queue named by
  # WORKER_QUEUE, so every queue needs its own service or its jobs are never processed. They scale and
  # fail independently. Keep maintenance at one replica (it runs the cron sweepers).
  worker-events:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_QUEUE: events

  worker-ai:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_QUEUE: ai

  worker-instagram:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_QUEUE: instagram

  worker-maintenance:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_QUEUE: maintenance

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
