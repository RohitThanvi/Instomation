name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: instomation
          POSTGRES_PASSWORD: instomation
          POSTGRES_DB: instomation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U instomation" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://instomation:instomation@localhost:5432/instomation_test
      TEST_REDIS_URL: redis://localhost:6379/1
      DATABASE_URL: postgresql+asyncpg://instomation:instomation@localhost:5432/instomation_test
      REDIS_URL: redis://localhost:6379/0
      CLERK_JWKS_URL: https://clerk.test/.well-known/jwks.json
      CLERK_ISSUER: https://clerk.test
      FRONTEND_BASE_URL: http://localhost:5173
      META_APP_ID: ci
      META_APP_SECRET: ci
      META_WEBHOOK_VERIFY_TOKEN: ci
      META_REDIRECT_URI: http://localhost:8000/api/v1/instagram/oauth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Generate a throwaway token-encryption key
        run: |
          key=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "TOKEN_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Migrations apply cleanly and match the models
        env:
          PGPASSWORD: instomation
          DATABASE_URL: postgresql+asyncpg://instomation:instomation@localhost:5432/instomation_drift
        run: |
          psql -h localhost -U instomation -d postgres -c "CREATE DATABASE instomation_drift"
          alembic upgrade head
          alembic check
      - name: Tests with the coverage gate (threshold lives in pyproject.toml)
        run: pytest -q --cov
