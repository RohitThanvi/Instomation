# Production overlay: adds the public HTTPS entry point (Caddy) and refuses to start on a default
# database password.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file publishes every port on 127.0.0.1 only, so nothing but Caddy (80/443) is reachable from
# outside the machine. Docker-published ports bypass the host firewall, which is why that matters.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (the public hostname) in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account live here: losing it means re-issuing and can hit rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
