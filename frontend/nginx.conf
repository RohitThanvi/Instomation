# Hashed build assets never change, so they are cached for a year; everything else (index.html above
# all) must be revalidated so a deploy takes effect. The policy is chosen here and applied once at
# server level: an add_header inside a location REPLACES the server-level ones instead of adding to
# them, so adding one to a location would silently drop the security headers from that location.
map $uri $cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Without `always`, so a 404 for a missing asset is never cached as immutable.
  add_header Cache-Control $cache_control;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
